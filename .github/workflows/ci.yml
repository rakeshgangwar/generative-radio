name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run unit tests on supported Python versions
        run: >-
          docker run --rm -v "$PWD:/app:ro" -w /app
          python:${{ matrix.python }}-slim-bookworm
          python -m unittest discover -s tests -v

  listener-tests:
    name: Listener controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run deterministic playback and presentation tests
        run: >-
          docker run --rm -v "$PWD:/app:ro" -w /app
          node:22-alpine node web/tests/unit.mjs

  container-integration:
    name: Audio and streaming integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.web.yaml
      RADIO_CI_PROJECT: radio-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the actual station image
        run: docker build -t generative-radio:local .
      - name: Build and validate the listener image
        run: |
          docker compose -p "$RADIO_CI_PROJECT" build web
          docker run --rm --network none --read-only --cap-drop ALL generative-radio-web:local \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Run all tests with real audio tools available
        run: >-
          docker run --rm --network none
          -v "$PWD/tests:/app/tests:ro" -v "$PWD/scripts:/app/scripts:ro"
          generative-radio:local python -m unittest discover -s tests -v
      - name: Validate real rendering and the Liquidsoap script
        run: |
          docker run --rm --network none -e ICECAST_SOURCE_PASSWORD=ci-test-source \
            generative-radio:local sh -eu -c '
              python -m radio preview --seconds 20 --seed 42
              cp /data/audio/preview.wav /data/audio/fallback.wav
              liquidsoap --check /app/deploy/radio.liq
            '
      - name: Start all five services and require healthy status
        env:
          SEGMENT_SECONDS: '20'
          BUFFER_SECONDS: '20'
        run: >-
          docker compose -p "$RADIO_CI_PROJECT" up --no-build
          --detach --wait --wait-timeout 180
      - name: Decode and validate ten seconds of the real MP3 stream
        run: |
          docker compose -p "$RADIO_CI_PROJECT" exec -T broadcaster \
            ffmpeg -nostdin -v error -y -rw_timeout 15000000 \
            -i http://icecast:8000/radio.mp3 -t 10 -ac 2 -ar 44100 \
            -c:a pcm_s16le /tmp/ci-stream.wav
          docker compose -p "$RADIO_CI_PROJECT" exec -T broadcaster python -c \
            'from pathlib import Path; from radio.render import analyze; result=analyze(Path("/tmp/ci-stream.wav")); assert abs(result["duration"]-10)<.1, result; print(result)'
      - name: Validate a short decoded-audio probe with startup margin
        if: success()
        run: |
          docker compose -p "$RADIO_CI_PROJECT" exec -T broadcaster python -c \
            'from dataclasses import replace; from threading import Event; from radio.watchdog import Options, probe_stream; result=probe_stream(replace(Options.load(),probe_seconds=1,timeout=8),Event()); assert result.kind=="healthy", result; print(result)'
      - name: Record and validate real host-side station vitals
        run: |
          RADIO_OBSERVER_LIVE_PROJECT="$RADIO_CI_PROJECT" \
            python3 -m unittest discover -s tests -p test_observer.py -k selected_docker_templates -v
          mkdir -p artifacts
          python3 -m radio.observer --project "$RADIO_CI_PROJECT" --expect-web \
            --duration 10 --interval 3 --max-samples 2 --output artifacts/station-vitals
          python3 - <<'PYVITALS'
          import json
          from pathlib import Path
          root = Path('artifacts/station-vitals')
          summary = json.loads((root/'summary.json').read_text())
          assert summary['state'] == 'complete' and summary['samples'] >= 2, summary
          assert summary['healthy'] == summary['samples'] and summary['retained'] == 2, summary
          assert len(list(root.glob('sample-*.json'))) == 2
          print(summary)
          PYVITALS
      - name: Validate the listener page, restricted routes and proxied audio
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          with urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5) as response:
              assert response.status == 200
              assert b'Start listening' in response.read()
              assert "default-src 'self'" in response.headers['Content-Security-Policy']
          with urllib.request.urlopen('http://127.0.0.1:8080/broadcast.json', timeout=5) as response:
              assert response.headers.get_content_type() == 'application/json'
              assert response.headers['Cache-Control'] == 'no-store'
              context = json.load(response)
              assert sorted(context) == ['available', 'title', 'version'], context
              assert context['version'] == 1 and context['available'] is True, context
              assert isinstance(context['title'], str) and 0 < len(context['title']) <= 160, context
          for path in ['/admin/', '/status-json.xsl', '/broadcast-context-json.xsl', '/radio.sqlite', '/data/', '/audio/']:
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080'+path, timeout=5)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise AssertionError(path+' was exposed')
          PY
          docker compose -p "$RADIO_CI_PROJECT" exec -T broadcaster \
            ffmpeg -nostdin -v error -y -rw_timeout 15000000 \
            -i http://web:8080/radio.mp3 -t 5 -c:a pcm_s16le /tmp/ci-web.wav
          docker compose -p "$RADIO_CI_PROJECT" exec -T broadcaster python -c \
            'from pathlib import Path; from radio.render import analyze; result=analyze(Path("/tmp/ci-web.wav")); assert abs(result["duration"]-5)<.1, result; print(result)'
      - name: Prepare audio backend for headless Firefox and host probes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio
          if ! pactl info >/dev/null 2>&1; then
            echo "Starting an audio server on this ephemeral runner."
            pulseaudio --start --exit-idle-time=-1
            echo "RADIO_CI_PULSE_STARTED=1" >> "$GITHUB_ENV"
          fi
          module_id="$(pactl load-module module-null-sink sink_name=radio_ci)"
          echo "RADIO_CI_PULSE_MODULE=$module_id" >> "$GITHUB_ENV"
          echo "PULSE_SINK=radio_ci" >> "$GITHUB_ENV"
          pactl set-default-sink radio_ci
          pactl list short sinks
      - name: Check stock Firefox playback
        id: firefox_playback
        run: |
          mkdir -p artifacts
          python3 - <<'PYFIREFOX'
          import json, shutil, subprocess, sys
          from pathlib import Path
          result_path = Path('artifacts/firefox-browser/result.json')
          completed = subprocess.run([
              sys.executable, '-m', 'radio.firefox_smoke',
              '--driver', shutil.which('geckodriver') or '',
              '--firefox', shutil.which('firefox') or '',
              '--output', str(result_path.parent),
          ])
          if result_path.exists():
              result = json.loads(result_path.read_text())
              print({key: result.get(key) for key in ('state', 'pass', 'browser', 'checks', 'failure', 'media', 'cleanup')}, flush=True)
              if completed.returncode == 0:
                  assert result['state'] == 'complete' and result['pass'] is True
                  assert len(result['checks']) == 5 and all(c['pass'] is True for c in result['checks'])
                  assert all(result['cleanup'].values())
          else:
              print({'result_report': 'unavailable'}, flush=True)
              assert completed.returncode != 0, 'A successful check must publish its result'
          raise SystemExit(completed.returncode)
          PYFIREFOX
      - name: Diagnose Firefox startup after a failed check
        if: failure() && steps.firefox_playback.outcome == 'failure'
        run: |
          python3 - <<'PYFIREFOXSTART'
          import shutil, subprocess, tempfile
          from pathlib import Path
          from radio.watchdog import terminate_process
          driver, firefox = shutil.which('geckodriver'), shutil.which('firefox')
          for name, binary in [('driver', driver), ('firefox', firefox)]:
              if not binary:
                  print({'binary': name, 'available': False}, flush=True)
                  continue
              try:
                  version = subprocess.run([binary, '--version'], capture_output=True, text=True, timeout=10)
                  print({'binary': name, 'path': str(Path(binary).resolve()), 'version': version.stdout.splitlines()[:1], 'exit': version.returncode}, flush=True)
              except subprocess.TimeoutExpired:
                  print({'binary': name, 'version_query': 'timeout'}, flush=True)
          if firefox:
              with tempfile.TemporaryDirectory(prefix='firefox-startup-', dir='artifacts') as directory:
                  root = Path(directory).resolve()
                  profile = root/'profile'
                  profile.mkdir(mode=0o700)
                  process = subprocess.Popen([firefox, '--headless', '--no-remote', '--profile', str(profile), '--screenshot', str(root/'blank.png'), 'about:blank'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
                  try:
                      try:
                          stdout, stderr = process.communicate(timeout=25)
                      except subprocess.TimeoutExpired:
                          terminate_process(process, .3)
                          stdout, stderr = process.communicate(timeout=2)
                      print({'blank_page_exit': process.returncode, 'png_created': (root/'blank.png').is_file(), 'startup_stderr_tail': stderr.decode(errors='replace')[-4000:]}, flush=True)
                  finally:
                      terminate_process(process, .3)
          PYFIREFOXSTART
      - name: Browser-test the listener against the actual live stream
        run: |
          npm --prefix web ci --ignore-scripts
          CHROME_BIN="$(command -v google-chrome)" npm --prefix web run test:browser
      - name: Render and browser-test the isolated melody audition
        run: |
          mkdir -p artifacts/melody-browser
          docker run --rm --network none --read-only --cap-drop ALL \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,size=64m,mode=1777 \
            --mount "type=bind,source=$PWD/artifacts/melody-browser,target=/auditions" \
            generative-radio:local python -m radio.melody_audition \
            --output /auditions/pair --station-seed 20261114 --positions 2 --seconds 120
          docker run --rm --detach --name "$RADIO_CI_PROJECT-melody" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18091:8080 \
            --mount "type=bind,source=$PWD/artifacts/melody-browser/pair,target=/srv,readonly" \
            generative-radio-web:local caddy file-server --root /srv --listen :8080
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18091/', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise AssertionError('Audition preview did not start')
          with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18091/baseline/listen.mp3', headers={'Range':'bytes=0-15'}), timeout=5) as response:
              assert response.status == 206 and len(response.read(17)) == 16
          PYREADY
          CHROME_BIN="$(command -v google-chrome)" \
            RADIO_MELODY_URL=http://127.0.0.1:18091 \
            RADIO_MELODY_ARTIFACTS="$PWD/artifacts/melody-browser/browser" \
            node web/tests/melody-audition.mjs
      - name: Exercise isolated production TLS, hardening and certificate recovery
        run: >-
          python3 scripts/production-smoke.py
          --project "radio-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Remove only this run's virtual audio fixture
        if: always()
        run: |
          if [ -n "${RADIO_CI_PULSE_MODULE:-}" ]; then
            pactl unload-module "$RADIO_CI_PULSE_MODULE" || true
          fi
          if [ "${RADIO_CI_PULSE_STARTED:-}" = "1" ]; then
            pulseaudio --kill || true
          fi
      - name: Show final service logs
        if: always()
        run: docker compose -p "$RADIO_CI_PROJECT" logs --no-color --tail 100
      - name: Remove only this run's audition preview
        if: always()
        run: |
          if docker container inspect "$RADIO_CI_PROJECT-melody" >/dev/null 2>&1; then
            docker rm --force "$RADIO_CI_PROJECT-melody"
          fi
      - name: Remove only this CI run's containers and data
        if: always()
        run: docker compose -p "$RADIO_CI_PROJECT" down --volumes --remove-orphans
