# Opt-in: combine with compose.yaml and compose.web.yaml using a private env file.
x-production: &production
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777

services:
  composer:
    <<: *production
  renderer:
    <<: *production
  broadcaster:
    <<: *production
  icecast:
    <<: *production
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Generate private production credentials first}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Generate private production credentials first}
  web:
    <<: *production
    command: [caddy, run, --config, /etc/caddy/Caddyfile.production, --adapter, caddyfile]
    environment:
      RADIO_DOMAIN: ${RADIO_DOMAIN:?Set the owned production DNS hostname}
    ports: !override
      - 80:8080
      - 443:8443
    volumes:
      - web-tls:/data
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /config:ro,noexec,nosuid,size=1m,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/healthz]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  web-tls:
