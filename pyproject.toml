[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-radio"
version = "0.1.0"
description = "A headless, buffered generative ambient radio station"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
radio = "radio.__main__:main"

[tool.setuptools]
packages = ["radio"]
